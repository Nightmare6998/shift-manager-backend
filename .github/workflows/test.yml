name: Test backend
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Test PostgreSQL and HTTP workflow
        env:
          APP_ENV: production
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
        run: |
          sh start.sh > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health; then break; fi
            sleep 1
          done
          python scripts/smoke_test.py http://localhost:5000
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start app and database
        run: |
          python scripts/setup_env.py
          docker compose up -d --build --wait
          python scripts/smoke_test.py http://localhost:5000
      - name: Check data survives a restart
        run: |
          curl -fsS -X POST http://localhost:5000/auth/register -H 'Content-Type: application/json' -d '{"email":"persistence@example.com","password":"test-password123"}'
          docker compose down
          docker compose up -d --wait
          curl -fsS -X POST http://localhost:5000/auth/login -H 'Content-Type: application/json' -d '{"email":"persistence@example.com","password":"test-password123"}' > /tmp/login.json
          python -c "import json; assert 'access_token' in json.load(open('/tmp/login.json')); print('Account survived restart.')"
      - name: Show container logs
        if: always()
        run: docker compose logs --tail=40
